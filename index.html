<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý mét dư</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background: #f5f5f5;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
      font-size: 14px;
    }

    .done {
      background: #ffdada;
      color: #777;
      text-decoration: line-through;
    }

    h3 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

    .topbtn {
      display: flex;
      gap: 5px;
    }

    .topbtn button {
      flex: 1;
    }
  </style>
</head>

<body>

  <h3>📦 Quản lý mét dư</h3>

  <select id="px">
    <option value="">-- Chọn phân xưởng --</option>
    <option value="may1">May 1</option>
    <option value="may2">May 2</option>
    <option value="may3">May 3</option>
    <option value="inep">In ép</option>
  </select>

  <input id="barcode" placeholder="Barcode">

  <!-- CAMERA -->
  <div id="reader"></div>

  <button id="toggleCamBtn" onclick="toggleCamera()">
    📷 Tắt camera
  </button>

  <input id="mavattu" list="listMavattu" placeholder="Mã vật tư">
  <datalist id="listMavattu"></datalist>

  <input id="metdu" type="number" placeholder="Mét dư">

  <button onclick="addData()">➕ Lưu</button>

  <div class="topbtn">
    <button onclick="exportExcel()">📥 Xuất Excel</button>

    <button onclick="document.getElementById('importFile').click()">
      📤 Nhập Excel
    </button>
  </div>

  <input type="file" id="importFile" hidden>

  <input id="search" placeholder="🔍 Tìm theo mã vật tư hoặc barcode">

  <h3 id="tongmet">Tổng: 0 mét</h3>

  <hr>

  <table>
    <thead>
      <tr>
        <th>Barcode</th>
        <th>Mã</th>
        <th>PX</th>
        <th>Mét</th>
        <th>Ngày</th>
        <th>Xuất</th>
        <th>Xoá</th>
      </tr>
    </thead>

    <tbody id="table"></tbody>
  </table>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-yrm3K3rmaRJgJeYEsgGXzpwZYetnR9Q",
      authDomain: "khodulieu-68b4e.firebaseapp.com",
      projectId: "khodulieu-68b4e",
      storageBucket: "khodulieu-68b4e.firebasestorage.app",
      messagingSenderId: "788765202899",
      appId: "1:788765202899:web:505f03caa36bcc2d71f726"
    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    let data = [];

    let danhSachMa = [];

    const pxInput = document.getElementById("px");

    const barcodeInput = document.getElementById("barcode");

    const mavattuInput = document.getElementById("mavattu");

    const metduInput = document.getElementById("metdu");

    const searchInput = document.getElementById("search");



    // ====================
    // THÊM DỮ LIỆU
    // ====================

    window.addData = async function () {

      const barcode = barcodeInput.value.trim();

      const mavattu = mavattuInput.value.trim();

      const metdu = metduInput.value.trim();

      const px = pxInput.value;

      if (!px) {
        alert("Vui lòng chọn phân xưởng");
        return;
      }

      if (!barcode && !mavattu) {
        alert("Nhập dữ liệu");
        return;
      }

      const trung = data.find(i => i.barcode === barcode);

      if (barcode && trung) {
        alert("Barcode đã tồn tại");
        return;
      }

      await addDoc(collection(db, "metdu"), {
        barcode,
        mavattu,
        metdu: Number(metdu) || 0,
        phanxuong: px,
        done: false,
        time: new Date().toISOString(),
        ngay: new Date().toLocaleDateString("vi-VN")
      });

      barcodeInput.value = "";

      mavattuInput.value = "";

      metduInput.value = "";

      barcodeInput.focus();
    };



    // ====================
    // DATALIST
    // ====================

    function updateDatalist() {

      const list = document.getElementById("listMavattu");

      list.innerHTML = "";

      let dataTheoPX = data;

      const pxDangChon = pxInput.value;

      if (pxDangChon) {
        dataTheoPX = data.filter(i => i.phanxuong === pxDangChon);
      }

      danhSachMa = [...new Set(
        dataTheoPX
          .map(i => (i.mavattu || "").trim())
          .filter(Boolean)
      )];

      danhSachMa.forEach(ma => {
        list.innerHTML += `<option value="${ma}">`;
      });

    }



    // ====================
    // HIỂN THỊ
    // ====================

    function render() {

      const table = document.getElementById("table");

      table.innerHTML = "";

      const pxDangChon = pxInput.value.trim().toLowerCase();

      const tuKhoa = searchInput.value.trim().toLowerCase();

      let filteredData = [...data];

      if (pxDangChon) {
        filteredData = filteredData.filter(item =>
          (item.phanxuong || "").toLowerCase() === pxDangChon
        );
      }

      if (tuKhoa) {
        filteredData = filteredData.filter(item =>
          (item.mavattu || "").toLowerCase().includes(tuKhoa) ||
          (item.barcode || "").toLowerCase().includes(tuKhoa)
        );
      }

      let tong = 0;

      filteredData.forEach((item) => {

        tong += Number(item.metdu || 0);

        const realIndex = data.findIndex(d => d.id === item.id);

        table.innerHTML += `
          <tr class="${item.done ? 'done' : ''}">
            <td>${item.barcode || ""}</td>
            <td>${item.mavattu || ""}</td>
            <td>${item.phanxuong || ""}</td>
            <td>${item.metdu || ""}</td>
            <td>${item.ngay || ""}</td>

            <td>
              <button onclick="toggle(${realIndex})">
                ${item.done ? "✅" : "📦"}
              </button>
            </td>

            <td>
              <button onclick="del(${realIndex})">
                ❌
              </button>
            </td>
          </tr>
        `;
      });

      document.getElementById("tongmet").innerText =
        "Tổng: " + tong + " mét";
    }



    // ====================
    // DONE
    // ====================

    window.toggle = async function (i) {

      const item = data[i];

      await updateDoc(doc(db, "metdu", item.id), {
        done: !item.done
      });

    };



    // ====================
    // XOÁ
    // ====================

    window.del = async function (i) {

      if (!confirm("Xoá?")) return;

      const item = data[i];

      await deleteDoc(doc(db, "metdu", item.id));

    };



    // ====================
    // EXPORT EXCEL
    // ====================

    window.exportExcel = function () {

      const excelData = data.map(i => ({
        Barcode: i.barcode || "",
        MaVatTu: i.mavattu || "",
        PhanXuong: i.phanxuong || "",
        MetDu: i.metdu || 0,
        Ngay: i.ngay || "",
        Done: i.done ? "X" : ""
      }));

      const ws = XLSX.utils.json_to_sheet(excelData);

      const wb = XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(wb, ws, "MetDu");

      XLSX.writeFile(wb, "metdu.xlsx");
    };



    // ====================
    // IMPORT EXCEL
    // ====================

    document.getElementById("importFile")
    .addEventListener("change", async function(e) {

      const file = e.target.files[0];

      const reader = new FileReader();

      reader.onload = async function(evt) {

        const dataExcel = new Uint8Array(evt.target.result);

        const workbook = XLSX.read(dataExcel, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const json = XLSX.utils.sheet_to_json(sheet);

        for (const row of json) {

          const trung = data.find(i =>
            i.barcode === row.Barcode
          );

          if (trung) continue;

          await addDoc(collection(db, "metdu"), {
            barcode: row.Barcode || "",
            mavattu: row.MaVatTu || "",
            phanxuong: row.PhanXuong || "",
            metdu: Number(row.MetDu) || 0,
            ngay: row.Ngay || "",
            done: row.Done === "X",
            time: new Date().toISOString()
          });

        }

        alert("Import thành công");

      };

      reader.readAsArrayBuffer(file);

    });



    // ====================
    // ENTER ĐỂ LƯU
    // ====================

    document.addEventListener("keydown", function(e) {

      if (e.key === "Enter") {
        addData();
      }

    });



    // ====================
    // CAMERA QUÉT BARCODE
    // ====================

    let html5QrCode = new Html5Qrcode("reader");

    let cameraRunning = false;

    let currentCameraId = null;



    async function startCamera() {

      const devices = await Html5Qrcode.getCameras();

      if (devices && devices.length) {

        const backCamera =
          devices.find(device =>
            device.label.toLowerCase().includes("back")
          ) || devices[devices.length - 1];

        currentCameraId = backCamera.id;

        await html5QrCode.start(

          currentCameraId,

          {
            fps: 15,

            qrbox: {
              width: 300,
              height: 150
            },

            aspectRatio: 1.777,

            disableFlip: true,

            videoConstraints: {
              facingMode: "environment",
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }

          },

          (decodedText) => {

            barcodeInput.value = decodedText;

            navigator.vibrate?.(100);

          }

        ).then(() => {

          const track =
            html5QrCode._localMediaStream
            ?.getVideoTracks?.()[0];

          if (track) {

            const capabilities = track.getCapabilities();

            if (capabilities.zoom) {

              track.applyConstraints({
                advanced: [
                  {
                    zoom: 2
                  }
                ]
              });

            }

          }

        });

        cameraRunning = true;

        document.getElementById("toggleCamBtn").innerText =
          "📷 Tắt camera";

      }

    }



    async function stopCamera() {

      await html5QrCode.stop();

      cameraRunning = false;

      document.getElementById("toggleCamBtn").innerText =
        "📷 Mở camera";

    }



    window.toggleCamera = async function () {

      if (cameraRunning) {

        await stopCamera();

      } else {

        await startCamera();

      }

    };



    // TỰ MỞ CAMERA
    startCamera();



    // ====================
    // FILTER
    // ====================

    pxInput.addEventListener("change", () => {
      updateDatalist();
      render();
    });

    searchInput.addEventListener("input", () => {
      render();
    });



    // ====================
    // FIREBASE REALTIME
    // ====================

    onSnapshot(collection(db, "metdu"), (snap) => {

      data = snap.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      data.sort((a, b) =>
        new Date(b.time) - new Date(a.time)
      );

      updateDatalist();

      render();

    });

  </script>

</body>
</html>
