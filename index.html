<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý mét dư</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0; /* Bỏ padding toàn trang để bảng tràn hết cỡ */
    }

    /* Khung chứa các ô nhập liệu phía trên trải rộng 100% bằng bảng */
    .container {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 8px 0 8px; /* Chỉ tạo khoảng cách nhẹ với viền màn hình */
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 4px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Tối ưu bảng phẳng đều, rộng khít bằng phần nhập liệu phía trên */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
      table-layout: fixed; 
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px 2px;
      text-align: center;
      font-size: 12px; 
      word-break: break-all; 
      vertical-align: middle;
    }

    th {
      background-color: #eeeeee;
      font-weight: bold;
    }

    /* Tỷ lệ chia cột chính xác chống tràn */
    th:nth-child(1), td:nth-child(1) { width: 7%; }   
    th:nth-child(2), td:nth-child(2) { width: 24%; }  
    th:nth-child(3), td:nth-child(3) { width: 21%; }  
    th:nth-child(4), td:nth-child(4) { width: 11%; }  
    th:nth-child(5), td:nth-child(5) { width: 13%; }  
    th:nth-child(6), td:nth-child(6) { width: 14%; }  
    th:nth-child(7), td:nth-child(7) { width: 10%; }  
    th:nth-child(8), td:nth-child(8) { width: 10%; }  

    .done {
      background: #ffdada;
      color: #777;
    }
    
    .done td:not(:nth-child(1)):not(:nth-child(6)):not(:nth-child(7)) {
      text-decoration: line-through;
    }

    h3 {
      margin: 10px 0 5px 0;
    }

    #reader {
      width: 100%;
      margin-top: 5px;
    }

    .topbtn {
      display: flex;
      gap: 5px;
      margin-bottom: 4px;
    }

    .topbtn button {
      flex: 1;
    }

    .btn-danger {
      background: #d32f2f;
    }
    
    .btn-warning {
      background: #f57c00;
      margin-bottom: 4px;
    }

    .input-edit-met {
      width: 100%;
      padding: 3px 0;
      margin: 0;
      text-align: center;
      border: 1px dashed #bbb;
      border-radius: 4px;
      font-size: 12px;
      background: transparent;
      box-sizing: border-box;
    }

    .input-edit-date {
      width: 100%;
      padding: 3px 0;
      margin: 0;
      font-size: 11px;
      text-align: center;
      border: 1px dashed #bbb;
      border-radius: 4px;
      background: transparent;
      box-sizing: border-box;
      -webkit-appearance: none;
    }
    
    td button {
      width: auto;
      padding: 4px 6px;
      margin: 0;
      font-size: 12px;
      border-radius: 4px;
      display: inline-block;
    }
    
    .cam-locked {
      border: 3px solid #ff9800 !important;
    }

    .chk-row {
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>📦 Quản lý mét dư</h3>

    <select id="px">
      <option value="">-- Chọn phân xưởng --</option>
      <option value="may1">May 1</option>
      <option value="may2">May 2</option>
      <option value="may3">May 3</option>
      <option value="inep">In ép</option>
    </select>

    <input id="barcode" placeholder="Barcode">

    <div id="reader"></div>

    <button id="toggleCamBtn" onclick="toggleCamera()">
      📷 Tắt camera
    </button>

    <input id="mavattu" list="listMavattu" placeholder="Mã vật tư">
    <datalist id="listMavattu"></datalist>

    <input id="metdu" type="number" placeholder="Mét dư">

    <button onclick="addData()">➕ Lưu (Enter)</button>

    <div class="topbtn">
      <button onclick="exportExcel()">📥 Xuất Excel</button>
      <button onclick="document.getElementById('importFile').click()">
        📤 Nhập Excel
      </button>
    </div>
    
    <button class="btn-warning" onclick="deleteSelectedRows()">🗑️ Xóa các mục đã chọn</button>
    <button class="btn-danger" onclick="clearAllData()">⚠️ Xóa tất cả dữ liệu</button>

    <input type="file" id="importFile" hidden>

    <input id="search" placeholder="🔍 Tìm theo mã vật tư hoặc barcode">

    <h3 id="tongmet">Tổng: 0 mét</h3>

    <hr style="margin: 8px 0; border: 0; border-top: 1px solid #ccc;">
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" style="width:15px; height:15px; margin:0; vertical-align:middle;"></th>
        <th>Barcode</th>
        <th>Mã</th>
        <th>PX</th>
        <th>Mét</th>
        <th>Ngày</th>
        <th>Xuất</th>
        <th>Xoá</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      updateDoc,
      writeBatch,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-yrm3K3rmaRJgJeYEsgGXzpwZYetnR9Q",
      authDomain: "khodulieu-68b4e.firebaseapp.com",
      projectId: "khodulieu-68b4e",
      storageBucket: "khodulieu-68b4e.firebasestorage.app",
      messagingSenderId: "788765202899",
      appId: "1:788765202899:web:505f03caa36bcc2d71f726"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let data = [];
    let danhSachMa = [];
    let isCameraScanningAllowed = true; 

    const pxInput = document.getElementById("px");
    const barcodeInput = document.getElementById("barcode");
    const mavattuInput = document.getElementById("mavattu");
    const metduInput = document.getElementById("metdu");
    const searchInput = document.getElementById("search");

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine"; 
        oscillator.frequency.value = 1300; 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1); 
      } catch (e) {
        console.error(e);
      }
    }

    function formatToInputDate(dateStr) {
      if(!dateStr || !dateStr.includes('/')) {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      const parts = dateStr.split('/');
      return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    }

    function formatFromInputDate(dateStr) {
      if(!dateStr) return new Date().toLocaleDateString("vi-VN");
      const parts = dateStr.split('-');
      return `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;
    }

    // ====================
    // THÊM DỮ LIỆU
    // ====================
    window.addData = async function () {
      const barcode = barcodeInput.value.trim();
      const mavattu = mavattuInput.value.trim();
      const metdu = metduInput.value.trim();
      const px = pxInput.value;

      if (!px) {
        alert("Vui lòng chọn phân xưởng");
        return;
      }

      if (!barcode && !mavattu) {
        alert("Vui lòng nhập Barcode hoặc Mã vật tư");
        return;
      }

      const trung = data.find(i => barcode && i.barcode === barcode);
      if (barcode && trung) {
        alert("Barcode này đã tồn tại trong hệ thống!");
        return;
      }

      try {
        await addDoc(collection(db, "metdu"), {
          barcode,
          mavattu,
          metdu: Number(metdu) || 0,
          phanxuong: px,
          done: false,
          time: new Date().toISOString(),
          ngay: new Date().toLocaleDateString("vi-VN")
        });

        barcodeInput.value = "";
        mavattuInput.value = "";
        metduInput.value = "";
        
        document.activeElement.blur();
        isCameraScanningAllowed = true;
        document.getElementById("reader").classList.remove("cam-locked");
        barcodeInput.focus();
      } catch (error) {
        console.error("Lỗi thêm dữ liệu: ", error);
      }
    };

    // ====================
    // DATALIST
    // ====================
    function updateDatalist() {
      const list = document.getElementById("listMavattu");
      list.innerHTML = "";
      let dataTheoPX = data;
      const pxDangChon = pxInput.value;
      if (pxDangChon) {
        dataTheoPX = data.filter(i => i.phanxuong === pxDangChon);
      }
      danhSachMa = [...new Set(dataTheoPX.map(i => (i.mavattu || "").trim()).filter(Boolean))];
      danhSachMa.forEach(ma => {
        const option = document.createElement("option");
        option.value = ma;
        list.appendChild(option);
      });
    }

    // ====================
    // HIỂN THỊ DỮ LIỆU
    // ====================
    function render() {
      const table = document.getElementById("table");
      table.innerHTML = "";
      document.getElementById("selectAll").checked = false;

      const pxDangChon = pxInput.value.trim().toLowerCase();
      const tuKhoa = searchInput.value.trim().toLowerCase();

      let filteredData = [...data];

      if (pxDangChon) {
        filteredData = filteredData.filter(item => (item.phanxuong || "").toLowerCase() === pxDangChon);
      }

      if (tuKhoa) {
        filteredData = filteredData.filter(item =>
          (item.mavattu || "").toLowerCase().includes(tuKhoa) ||
          (item.barcode || "").toLowerCase().includes(tuKhoa)
        );
      }

      let tong = 0;
      filteredData.forEach((item) => {
        tong += Number(item.metdu || 0);
        const htmlDate = formatToInputDate(item.ngay);

        table.innerHTML += `
          <tr class="${item.done ? 'done' : ''}">
            <td>
              <input type="checkbox" class="chk-row" value="${item.id}">
            </td>
            <td>${item.barcode || ""}</td>
            <td>${item.mavattu || ""}</td>
            <td>${item.phanxuong || ""}</td>
            <td>
              <input type="number" step="any" class="input-edit-met" value="${item.metdu || 0}" 
                onkeydown="updateMetDuDirectly(event, '${item.id}')">
            </td>
            <td>
              <input type="date" class="input-edit-date" value="${htmlDate}" 
                onchange="updateNgayDirectly(this.value, '${item.id}')">
            </td>
            <td>
              <button onclick="toggle('${item.id}')">${item.done ? "✅" : "📦"}</button>
            </td>
            <td>
              <button style="background:#d32f2f;" onclick="del('${item.id}')">❌</button>
            </td>
          </tr>
        `;
      });

      document.getElementById("tongmet").innerText = "Tổng: " + tong + " mét";
    }

    window.updateMetDuDirectly = async function (e, id) {
      if (e.key === "Enter") {
        e.preventDefault();
        const newMetVal = Number(e.target.value);
        if (isNaN(newMetVal) || newMetVal < 0) {
          alert("Số mét không hợp lệ!");
          return;
        }
        try {
          await updateDoc(doc(db, "metdu", id), { metdu: newMetVal });
          e.target.blur();
        } catch (error) {
          console.error(error);
        }
      }
    };

    window.updateNgayDirectly = async function (newDateVal, id) {
      if(!newDateVal) return;
      const formattedDate = formatFromInputDate(newDateVal);
      try {
        await updateDoc(doc(db, "metdu", id), { ngay: formattedDate });
      } catch (error) {
        console.error(error);
      }
    };

    window.toggleSelectAll = function (master) {
      const checkboxes = document.querySelectorAll('.chk-row');
      checkboxes.forEach(chk => chk.checked = master.checked);
    };

    window.deleteSelectedRows = async function () {
      const checkboxes = document.querySelectorAll('.chk-row:checked');
      if (checkboxes.length === 0) {
        alert("Vui lòng tích chọn ít nhất một mục để xóa!");
        return;
      }
      if (!confirm(`Bạn chắc chắn muốn XÓA ${checkboxes.length} mục đã chọn này?`)) return;

      try {
        const batch = writeBatch(db);
        checkboxes.forEach(chk => {
          batch.delete(doc(db, "metdu", chk.value));
        });
        await batch.commit();
        alert(`Đã xóa thành công ${checkboxes.length} mục!`);
      } catch (error) {
        console.error(error);
      }
    };

    window.toggle = async function (id) {
      const item = data.find(d => d.id === id);
      if (!item) return;
      try {
        await updateDoc(doc(db, "metdu", id), { done: !item.done });
      } catch (error) {
        console.error(error);
      }
    };

    window.del = async function (id) {
      if (!confirm("Xóa mục này?")) return;
      try { await deleteDoc(doc(db, "metdu", id)); } catch (error) { console.error(error); }
    };

    window.clearAllData = async function () {
      if (!confirm("⚠️ Chắc chắn muốn XÓA TOÀN BỘ vật tư số dư trên hệ thống?")) return;
      try {
        const querySnapshot = await getDocs(collection(db, "metdu"));
        if(querySnapshot.empty) return;
        const batch = writeBatch(db);
        querySnapshot.forEach((docSnap) => { batch.delete(docSnap.ref); });
        await batch.commit();
        alert("Đã xóa toàn bộ kho thành công!");
      } catch (error) { console.error(error); }
    };

    // EXPORT EXCEL
    window.exportExcel = function () {
      const excelData = data.map(i => ({
        Barcode: i.barcode || "",
        MaVatTu: i.mavattu || "",
        PhanXuong: i.phanxuong || "",
        MetDu: i.metdu || 0,
        Ngay: i.ngay || "",
        Done: i.done ? "X" : ""
      }));
      const ws = XLSX.utils.json_to_sheet(excelData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "MetDu");
      XLSX.writeFile(wb, "metdu_all.xlsx");
    };

    // IMPORT EXCEL
    document.getElementById("importFile").addEventListener("change", async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const dataExcel = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(dataExcel, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);

          for (const row of json) {
            const barcodeVal = row.Barcode ? String(row.Barcode).trim() : "";
            if (barcodeVal && data.some(i => i.barcode === barcodeVal)) continue;

            await addDoc(collection(db, "metdu"), {
              barcode: barcodeVal,
              mavattu: row.MaVatTu ? String(row.MaVatTu).trim() : "",
              phanxuong: row.PhanXuong ? String(row.PhanXuong).trim() : "",
              metdu: Number(row.MetDu) || 0,
              ngay: row.Ngay || new Date().toLocaleDateString("vi-VN"),
              done: row.Done === "X" || row.Done === "x",
              time: new Date().toISOString()
            });
          }
          alert("Import Excel thành công!");
        } catch (err) { alert("Lỗi đọc file."); }
        e.target.value = ""; 
      };
      reader.readAsArrayBuffer(file);
    });

    metduInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        addData();
      }
    });

    // CAMERA QUÉT BARCODE
    let html5QrCode = new Html5Qrcode("reader");
    let cameraRunning = false;
    let currentCameraId = null;

    async function startCamera() {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
          const backCamera = devices.find(device => device.label.toLowerCase().includes("back")) || devices[devices.length - 1];
          currentCameraId = backCamera.id;

          await html5QrCode.start(
            currentCameraId,
            {
              fps: 15,
              qrbox: { width: 260, height: 130 },
              aspectRatio: 1.777,
              disableFlip: true,
              videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
            },
            (decodedText) => {
              if (!isCameraScanningAllowed) return;
              isCameraScanningAllowed = false;
              document.getElementById("reader").classList.add("cam-locked");

              barcodeInput.value = decodedText; 
              playBeepSound();                  
              navigator.vibrate?.(100);         
              
              setTimeout(() => {
                metduInput.focus();
                metduInput.select(); 
              }, 150);
            }
          );
          cameraRunning = true;
          document.getElementById("toggleCamBtn").innerText = "📷 Tắt camera";
        }
      } catch (err) { console.error(err); }
    }

    async function stopCamera() {
      if (!cameraRunning) return;
      await html5QrCode.stop();
      cameraRunning = false;
      document.getElementById("toggleCamBtn").innerText = "📷 Mở camera";
    }

    window.toggleCamera = async function () {
      if (cameraRunning) { await stopCamera(); } else { await startCamera(); }
    };

    startCamera();

    pxInput.addEventListener("change", () => { updateDatalist(); render(); });
    searchInput.addEventListener("input", () => { render(); });

    const q = query(collection(db, "metdu"), orderBy("time", "desc"));
    onSnapshot(q, (snap) => {
      data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateDatalist();
      render();
    });
  </script>

</body>
</html>
