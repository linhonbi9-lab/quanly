<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý mét dư</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0; 
    }

    .container {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 8px 0 8px; 
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 4px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .row-calc {
      display: flex;
      gap: 6px;
    }
    .row-calc div {
      flex: 1;
    }
    .row-calc label {
      font-size: 12px;
      color: #555;
      font-weight: bold;
      display: block;
      margin-top: 2px;
    }

    .action-grid {
      display: flex;
      gap: 4px;
      margin: 4px 0;
    }
    .action-grid button {
      margin: 0;
      font-size: 13px;
      padding: 8px 4px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      max-height: 65vh; 
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      table-layout: fixed; 
    }

    th, td {
      border: 1px solid #ddd;
      padding: 7px 2px;
      text-align: center;
      font-size: 12px; 
      word-break: break-all; 
      vertical-align: middle;
    }

    th {
      background-color: #2196f3; 
      color: white;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    th:nth-child(1), td:nth-child(1) { width: 7%; }   
    th:nth-child(2), td:nth-child(2) { width: 24%; }  
    th:nth-child(3), td:nth-child(3) { width: 21%; }  
    th:nth-child(4), td:nth-child(4) { width: 11%; }  
    th:nth-child(5), td:nth-child(5) { width: 13%; }  
    th:nth-child(6), td:nth-child(6) { width: 14%; }  
    th:nth-child(7), td:nth-child(7) { width: 10%; }  
    th:nth-child(8), td:nth-child(8) { width: 10%; }  

    .done {
      background: #ffdada !important;
      color: #777;
    }
    
    .done td:not(:nth-child(1)):not(:nth-child(6)):not(:nth-child(7)) {
      text-decoration: line-through;
    }

    h3 {
      margin: 8px 0 4px 0;
    }

    #reader {
      width: 100%;
      margin-top: 5px;
      background: #333;
      border-radius: 8px;
    }
    
    .btn-warning {
      background: #f57c00;
    }

    .input-edit-met {
      width: 100%;
      padding: 4px 0;
      margin: 0;
      text-align: center;
      border: 1px dashed #bbb;
      border-radius: 4px;
      font-size: 12px;
      background: transparent;
      box-sizing: border-box;
    }

    .input-edit-date {
      width: 100%;
      padding: 4px 0;
      margin: 0;
      font-size: 11px;
      text-align: center;
      border: 1px dashed #bbb;
      border-radius: 4px;
      background: transparent;
      box-sizing: border-box;
      -webkit-appearance: none;
    }
    
    td button {
      width: auto;
      padding: 4px 5px;
      margin: 0;
      font-size: 11px;
      border-radius: 4px;
      display: inline-block;
    }
    
    .cam-locked {
      border: 3px solid #ff9800 !important;
    }

    .chk-row {
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }

    .info-text {
      padding: 20px;
      text-align: center;
      font-style: italic;
      color: #00796b;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h3>📦 Quản lý mét dư</h3>

    <select id="px">
      <option value="">-- Chọn phân xưởng --</option>
      <option value="may1">May 1</option>
      <option value="may2">May 2</option>
      <option value="may3">May 3</option>
      <option value="inep">In ép</option>
    </select>

    <input id="barcode" placeholder="Barcode" oninput="checkAndFillGocData(this.value, 'barcode')">

    <div id="reader"></div>

    <button id="toggleCamBtn" onclick="toggleCamera()">📷 Tắt camera</button>

    <input id="mavattu" list="listMavattu" placeholder="Mã vật tư" oninput="checkAndFillGocData(this.value, 'mavattu')">
    <datalist id="listMavattu"></datalist>

    <div class="row-calc">
      <div>
        <label>Mét ban đầu (Gốc)</label>
        <input id="metgoc" type="number" placeholder="Gốc" oninput="tinhToanSoDu()">
      </div>
      <div>
        <label>Mét đã sử dụng</label>
        <input id="metdadung" type="number" placeholder="Đã dùng" oninput="tinhToanSoDu()">
      </div>
      <div>
        <label>Mét dư (Kết quả)</label>
        <input id="metdu" type="number" placeholder="Kết quả" style="background: #e0f2f1; font-weight: bold; border: 1px solid #009688;">
      </div>
    </div>

    <button onclick="addData()" style="background: #2e7d32; margin-top: 8px;">➕ Lưu dữ liệu (Enter)</button>

    <div class="action-grid">
      <button onclick="exportExcel()" style="background: #1565c0;">📥 Xuất Excel</button>
      <button onclick="document.getElementById('importFile').click()" style="background: #37474f;">📤 Nhập Excel</button>
      <button class="btn-warning" onclick="deleteSelectedRows()">🗑️ Xóa ô chọn</button>
    </div>

    <input type="file" id="importFile" hidden>

    <input id="search" placeholder="🔍 Gõ vào đây để tìm Mã vật tư hoặc Barcode...">

    <h3 id="tongmet" style="display:inline-block; margin-right: 10px;">Tổng nhà máy: 0 mét</h3>
    <div style="font-size:11px; color:#e65100; font-weight:bold; margin-top: 2px;">⏰ Đã bật: Mục xuất (✅) tự động xóa hoàn toàn sau 3 ngày</div>

    <hr style="margin: 6px 0; border: 0; border-top: 1px solid #ccc;">
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" style="width:15px; height:15px; margin:0; vertical-align:middle;"></th>
          <th>Barcode</th>
          <th>Mã</th>
          <th>PX</th>
          <th>Mét</th>
          <th>Ngày</th>
          <th>Xuất</th>
          <th>Xoá</th>
        </tr>
      </thead>
      <tbody id="table">
        <tr>
          <td colspan="8" class="info-text">🔍 Nhập từ khóa hoặc quét barcode để tìm kiếm...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      updateDoc,
      writeBatch,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-yrm3K3rmaRJgJeYEsgGXzpwZYetnR9Q",
      authDomain: "khodulieu-68b4e.firebaseapp.com",
      projectId: "khodulieu-68b4e",
      storageBucket: "khodulieu-68b4e.firebasestorage.app",
      messagingSenderId: "788765202899",
      appId: "1:788765202899:web:505f03caa36bcc2d71f726"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allFirebaseData = []; 
    let lastAddedItem = null; 

    const pxInput = document.getElementById("px");
    const barcodeInput = document.getElementById("barcode");
    const mavattuInput = document.getElementById("mavattu");
    const metgocInput = document.getElementById("metgoc");
    const metdadungInput = document.getElementById("metdadung");
    const metduInput = document.getElementById("metdu");
    const searchInput = document.getElementById("search");

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine"; 
        oscillator.frequency.value = 1300; 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1); 
      } catch (e) { console.error(e); }
    }

    // TỰ ĐỘNG TRA CỨU SỐ MÉT CŨ
    window.checkAndFillGocData = function (val, type) {
      if(!val.trim()) return;
      
      const foundItem = allFirebaseData.find(item => {
        if(type === 'barcode') return (item.barcode || '').toLowerCase() === val.trim().toLowerCase();
        if(type === 'mavattu') return (item.mavattu || '').toLowerCase() === val.trim().toLowerCase();
        return false;
      });

      if(foundItem) {
        metgocInput.value = foundItem.metdu || 0;
        tinhToanSoDu();
      }
    };

    // TỰ ĐỘNG TRỪ SỐ MÉT
    window.tinhToanSoDu = function () {
      const goc = Number(metgocInput.value) || 0;
      const dadung = Number(metdadungInput.value) || 0;
      
      if(metdadungInput.value.trim() === "") {
        metduInput.value = goc;
      } else {
        const ketqua = goc - dadung;
        metduInput.value = Math.round(ketqua * 100) / 100; 
      }
    };

    function formatToInputDate(dateStr) {
      if(!dateStr || !dateStr.includes('/')) {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      const parts = dateStr.split('/');
      return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    }

    function formatFromInputDate(dateStr) {
      if(!dateStr) return new Date().toLocaleDateString("vi-VN");
      const parts = dateStr.split('-');
      return `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;
    }

    // ====================
    // THÊM DỮ LIỆU
    // ====================
    window.addData = async function () {
      const barcode = barcodeInput.value.trim();
      const mavattu = mavattuInput.value.trim();
      const metdu = metduInput.value.trim();
      const px = pxInput.value;

      if (!px) { alert("Vui lòng chọn phân xưởng"); return; }
      if (!barcode && !mavattu) { alert("Vui lòng nhập Barcode hoặc Mã vật tư"); return; }

      try {
        const nowIso = new Date().toISOString();
        const docRef = await addDoc(collection(db, "metdu"), {
          barcode,
          mavattu,
          metdu: Number(metdu) || 0,
          phanxuong: px,
          done: false,
          time: nowIso,
          ngay: new Date().toLocaleDateString("vi-VN")
        });

        lastAddedItem = {
          id: docRef.id,
          barcode,
          mavattu,
          metdu: Number(metdu) || 0,
          phanxuong: px,
          done: false,
          ngay: new Date().toLocaleDateString("vi-VN"),
          time: nowIso
        };

        barcodeInput.value = "";
        mavattuInput.value = "";
        metgocInput.value = "";
        metdadungInput.value = "";
        metduInput.value = "";
        
        document.activeElement.blur();
        isCameraScanningAllowed = true;
        document.getElementById("reader").classList.remove("cam-locked");
        barcodeInput.focus();
        
        render();
      } catch (error) { console.error(error); }
    };

    function updateDatalist() {
      const list = document.getElementById("listMavattu");
      list.innerHTML = "";
      let dataTheoPX = allFirebaseData;
      if (pxInput.value) {
        dataTheoPX = allFirebaseData.filter(i => i.phanxuong === pxInput.value);
      }
      const danhSachMa = [...new Set(dataTheoPX.map(i => (i.mavattu || "").trim()).filter(Boolean))];
      danhSachMa.forEach(ma => {
        const option = document.createElement("option");
        option.value = ma;
        list.appendChild(option);
      });
    }

    // ====================================================
    // HIỂN THỊ VÀ TÍNH TỔNG SỐ DƯ THEO NHÀ MÁY ĐƯỢC CHỌN
    // ====================================================
    function render() {
      const table = document.getElementById("table");
      table.innerHTML = "";
      document.getElementById("selectAll").checked = false;

      const pxDangChon = pxInput.value.trim().toLowerCase();
      const tuKhoa = searchInput.value.trim().toLowerCase();

      // --- Tính toán TỔNG SỐ DƯ của Nhà máy/Phân xưởng đang chọn ---
      let dataTinhTong = [...allFirebaseData];
      if (pxDangChon) {
        dataTinhTong = dataTinhTong.filter(item => (item.phanxuong || "").toLowerCase() === pxDangChon);
      }
      let tongSoDuPX = 0;
      dataTinhTong.forEach(item => {
        tongSoDuPX += Number(item.metdu || 0);
      });
      
      const tenNhaMay = pxInput.value ? pxInput.options[pxInput.selectedIndex].text : "Toàn bộ";
      document.getElementById("tongmet").innerText = "Tổng " + tenNhaMay + ": " + Math.round(tongSoDuPX * 100) / 100 + " mét";
      // -------------------------------------------------------------

      let targetData = [];
      if (tuKhoa) {
        targetData = allFirebaseData.filter(item =>
          (item.mavattu || "").toLowerCase().includes(tuKhoa) ||
          (item.barcode || "").toLowerCase().includes(tuKhoa)
        );
        if (pxDangChon) {
          targetData = targetData.filter(item => (item.phanxuong || "").toLowerCase() === pxDangChon);
        }
      } 
      else if (lastAddedItem) {
        targetData = [lastAddedItem];
      }

      if (targetData.length === 0) {
        if (tuKhoa) {
          table.innerHTML = `<tr><td colspan="8" style="padding:15px; color:#999;">Không tìm thấy kết quả</td></tr>`;
        } else {
          table.innerHTML = `<tr><td colspan="8" class="info-text">🔍 Nhập từ khóa hoặc quét barcode để tìm kiếm...</td></tr>`;
        }
        return;
      }

      targetData.forEach((item) => {
        const htmlDate = formatToInputDate(item.ngay);

        table.innerHTML += `
          <tr class="${item.done ? 'done' : ''}">
            <td><input type="checkbox" class="chk-row" value="${item.id}"></td>
            <td>${item.barcode || ""}</td>
            <td>${item.mavattu || ""}</td>
            <td>${item.phanxuong || ""}</td>
            <td>
              <input type="number" step="any" class="input-edit-met" value="${item.metdu || 0}" 
                onkeydown="updateMetDuDirectly(event, '${item.id}')">
            </td>
            <td>
              <input type="date" class="input-edit-date" value="${htmlDate}" 
                onchange="updateNgayDirectly(this.value, '${item.id}')">
            </td>
            <td><button onclick="toggle('${item.id}')">${item.done ? "✅" : "📦"}</button></td>
            <td><button style="background:#d32f2f;" onclick="del('${item.id}')">🗑️</button></td>
          </tr>
        `;
      });
    }

    // ====================================================
    // TỰ ĐỘNG QUÉT VÀ XÓA MỤC XUẤT QUÁ 3 NGÀY (72 TIẾNG)
    // ====================================================
    async function autoDeleteOldDoneItems(items) {
      const baNgayTruoc = new Date().getTime() - (3 * 24 * 60 * 60 * 1000); // Mốc thời gian 3 ngày trước tính theo mili-giây
      const batch = writeBatch(db);
      let coHangXoa = false;

      items.forEach(item => {
        // Nếu đã xuất (done: true) và có lưu mốc thời gian 'time'
        if (item.done && item.time) {
          const thờiGianCheck = new Date(item.time).getTime();
          if (thờiGianCheck < baNgayTruoc) {
            batch.delete(doc(db, "metdu", item.id));
            coHangXoa = true;
          }
        }
      });

      if (coHangXoa) {
        try {
          await batch.commit();
          console.log("Hệ thống tự động dọn dẹp: Đã xóa các mục xuất quá hạn 3 ngày.");
        } catch (err) {
          console.error("Lỗi dọn rác tự động:", err);
        }
      }
    }

    window.updateMetDuDirectly = async function (e, id) {
      if (e.key === "Enter") {
        e.preventDefault();
        const newMetVal = Number(e.target.value);
        if (isNaN(newMetVal) || newMetVal < 0) { alert("Số mét lỗi!"); return; }
        try {
          await updateDoc(doc(db, "metdu", id), { metdu: newMetVal });
          if(lastAddedItem && lastAddedItem.id === id) lastAddedItem.metdu = newMetVal;
          e.target.blur();
        } catch (error) { console.error(error); }
      }
    };

    window.updateNgayDirectly = async function (newDateVal, id) {
      if(!newDateVal) return;
      const formattedDate = formatFromInputDate(newDateVal);
      try {
        await updateDoc(doc(db, "metdu", id), { ngay: formattedDate });
        if(lastAddedItem && lastAddedItem.id === id) lastAddedItem.ngay = formattedDate;
      } catch (error) { console.error(error); }
    };

    window.toggleSelectAll = function (master) {
      document.querySelectorAll('.chk-row').forEach(chk => chk.checked = master.checked);
    };

    window.deleteSelectedRows = async function () {
      const checkboxes = document.querySelectorAll('.chk-row:checked');
      if (checkboxes.length === 0) { alert("Hãy tích chọn mục cần xóa!"); return; }
      if (!confirm(`Xóa ${checkboxes.length} mục đã chọn?`)) return;

      try {
        const batch = writeBatch(db);
        checkboxes.forEach(chk => {
          batch.delete(doc(db, "metdu", chk.value));
          if(lastAddedItem && lastAddedItem.id === chk.value) lastAddedItem = null;
        });
        await batch.commit();
      } catch (error) { console.error(error); }
    };

    window.toggle = async function (id) {
      const item = allFirebaseData.find(d => d.id === id);
      if (!item) return;
      try { 
        // Khi bấm đổi sang trạng thái xuất (✅), cập nhật lại mốc 'time' hiện tại làm căn cứ tính 3 ngày sau để xóa
        await updateDoc(doc(db, "metdu", id), { 
          done: !item.done,
          time: new Date().toISOString()
        }); 
        if(lastAddedItem && lastAddedItem.id === id) {
          lastAddedItem.done = !item.done;
          lastAddedItem.time = new Date().toISOString();
        }
      } catch (error) { console.error(error); }
    };

    window.del = async function (id) {
      if (!confirm("Xóa mục này?")) return;
      try { 
        await deleteDoc(doc(db, "metdu", id)); 
        if(lastAddedItem && lastAddedItem.id === id) lastAddedItem = null;
      } catch (error) { console.error(error); }
    };

    // EXPORT EXCEL
    window.exportExcel = function () {
      if(allFirebaseData.length === 0) { alert("Không có dữ liệu để xuất!"); return; }
      const excelData = allFirebaseData.map(i => ({
        Barcode: i.barcode || "",
        MaVatTu: i.mavattu || "",
        PhanXuong: i.phanxuong || "",
        MetDu: i.metdu || 0,
        Ngay: i.ngay || "",
        Done: i.done ? "X" : ""
      }));
      const ws = XLSX.utils.json_to_sheet(excelData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "MetDu");
      XLSX.writeFile(wb, "metdu_all.xlsx");
    };

    // IMPORT EXCEL
    document.getElementById("importFile").addEventListener("change", async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const dataExcel = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(dataExcel, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);

          for (const row of json) {
            await addDoc(collection(db, "metdu"), {
              barcode: row.Barcode ? String(row.Barcode).trim() : "",
              mavattu: row.MaVatTu ? String(row.MaVatTu).trim() : "",
              phanxuong: row.PhanXuong ? String(row.PhanXuong).trim() : "",
              metdu: Number(row.MetDu) || 0,
              ngay: row.Ngay || new Date().toLocaleDateString("vi-VN"),
              done: row.Done === "X" || row.Done === "x",
              time: new Date().toISOString()
            });
          }
          alert("Import thành công!");
        } catch (err) { alert("Lỗi đọc file."); }
          e.target.value = ""; 
      };
      reader.readAsArrayBuffer(file);
    });

    metdadungInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") { e.preventDefault(); addData(); }
    });

    // CAMERA TỐI ƯU
    let html5QrCode = new Html5Qrcode("reader");
    let cameraRunning = false;

    async function startCamera() {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
          const backCamera = devices.find(device => device.label.toLowerCase().includes("back")) || devices[devices.length - 1];
          await html5QrCode.start(
            backCamera.id,
            {
              fps: 10, 
              qrbox: { width: 250, height: 125 },
              aspectRatio: 1.777,
              disableFlip: true,
              videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            },
            (decodedText) => {
              if (!isCameraScanningAllowed) return;
              isCameraScanningAllowed = false;
              document.getElementById("reader").classList.add("cam-locked");

              barcodeInput.value = decodedText; 
              playBeepSound();                  
              navigator.vibrate?.(100);         
              
              searchInput.value = decodedText;
              checkAndFillGocData(decodedText, 'barcode');

              setTimeout(() => {
                metdadungInput.focus();
                metdadungInput.select(); 
              }, 150);
            }
          );
          cameraRunning = true;
          document.getElementById("toggleCamBtn").innerText = "📷 Tắt camera";
        }
      } catch (err) { console.error(err); }
    }

    async function stopCamera() {
      if (!cameraRunning) return;
      await html5QrCode.stop();
      cameraRunning = false;
      document.getElementById("toggleCamBtn").innerText = "📷 Mở camera";
    }

    window.toggleCamera = async function () {
      if (cameraRunning) { await stopCamera(); } else { await startCamera(); }
    };

    startCamera();

    pxInput.addEventListener("change", () => { updateDatalist(); render(); });
    searchInput.addEventListener("input", () => { render(); });

    const q = query(collection(db, "metdu"), orderBy("time", "desc"));
    onSnapshot(q, (snap) => {
      allFirebaseData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateDatalist();
      render(); 
      autoDeleteOldDoneItems(allFirebaseData); // Tự động quét và xóa rác quá 3 ngày mỗi khi dữ liệu cập nhật
    });
  </script>

</body>
</html>
