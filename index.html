<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý mét dư</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background: #f5f5f5;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
      font-size: 14px;
    }

    .done {
      background: #ffdada;
      color: #777;
    }
    
    .done td:not(:nth-child(4)) {
      text-decoration: line-through;
    }

    h3 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

    .topbtn {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    .topbtn button {
      flex: 1;
    }

    .btn-danger {
      background: #d32f2f;
    }

    .input-edit-met {
      width: 70px;
      padding: 4px;
      margin: 0;
      text-align: center;
      border-radius: 4px;
    }
    
    .cam-locked {
      border: 3px solid #ff9800 !important;
    }
  </style>
</head>

<body>

  <h3>📦 Quản lý mét dư</h3>

  <select id="px">
    <option value="">-- Chọn phân xưởng --</option>
    <option value="may1">May 1</option>
    <option value="may2">May 2</option>
    <option value="may3">May 3</option>
    <option value="inep">In ép</option>
  </select>

  <input id="barcode" placeholder="Barcode">

  <div id="reader"></div>

  <button id="toggleCamBtn" onclick="toggleCamera()">
    📷 Tắt camera
  </button>

  <input id="mavattu" list="listMavattu" placeholder="Mã vật tư">
  <datalist id="listMavattu"></datalist>

  <input id="metdu" type="number" placeholder="Mét dư">

  <button onclick="addData()">➕ Lưu (Enter)</button>

  <div class="topbtn">
    <button onclick="exportExcel()">📥 Xuất Excel</button>
    <button onclick="document.getElementById('importFile').click()">
      📤 Nhập Excel
    </button>
  </div>
  
  <button class="btn-danger" onclick="clearAllData()">🗑️ Xóa tất cả dữ liệu</button>

  <input type="file" id="importFile" hidden>

  <input id="search" placeholder="🔍 Tìm theo mã vật tư hoặc barcode">

  <h3 id="tongmet">Tổng: 0 mét</h3>

  <hr>

  <table>
    <thead>
      <tr>
        <th>Barcode</th>
        <th>Mã</th>
        <th>PX</th>
        <th>Mét</th>
        <th>Ngày</th>
        <th>Xuất</th>
        <th>Xoá</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      updateDoc,
      writeBatch,
      getDocs,
      query,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-yrm3K3rmaRJgJeYEsgGXzpwZYetnR9Q",
      authDomain: "khodulieu-68b4e.firebaseapp.com",
      projectId: "khodulieu-68b4e",
      storageBucket: "khodulieu-68b4e.firebasestorage.app",
      messagingSenderId: "788765202899",
      appId: "1:788765202899:web:505f03caa36bcc2d71f726"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let data = [];
    let danhSachMa = [];
    let isCameraScanningAllowed = true; 

    const pxInput = document.getElementById("px");
    const barcodeInput = document.getElementById("barcode");
    const mavattuInput = document.getElementById("mavattu");
    const metduInput = document.getElementById("metdu");
    const searchInput = document.getElementById("search");

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine"; 
        oscillator.frequency.value = 1300; 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1); 
      } catch (e) {
        console.error(e);
      }
    }

    // ====================
    // THÊM DỮ LIỆU
    // ====================
    window.addData = async function () {
      const barcode = barcodeInput.value.trim();
      const mavattu = mavattuInput.value.trim();
      const metdu = metduInput.value.trim();
      const px = pxInput.value;

      if (!px) {
        alert("Vui lòng chọn phân xưởng");
        return;
      }

      if (!barcode && !mavattu) {
        alert("Vui lòng nhập Barcode hoặc Mã vật tư");
        return;
      }

      const trung = data.find(i => barcode && i.barcode === barcode);
      if (barcode && trung) {
        alert("Barcode này đã tồn tại trong hệ thống!");
        return;
      }

      try {
        await addDoc(collection(db, "metdu"), {
          barcode,
          mavattu,
          metdu: Number(metdu) || 0,
          phanxuong: px,
          done: false,
          time: new Date().toISOString(),
          ngay: new Date().toLocaleDateString("vi-VN")
        });

        barcodeInput.value = "";
        mavattuInput.value = "";
        metduInput.value = "";
        
        document.activeElement.blur();
        
        isCameraScanningAllowed = true;
        document.getElementById("reader").classList.remove("cam-locked");
        
        barcodeInput.focus();
      } catch (error) {
        console.error("Lỗi thêm dữ liệu: ", error);
      }
    };

    // ====================
    // DATALIST
    // ====================
    function updateDatalist() {
      const list = document.getElementById("listMavattu");
      list.innerHTML = "";
      let dataTheoPX = data;
      const pxDangChon = pxInput.value;
      if (pxDangChon) {
        dataTheoPX = data.filter(i => i.phanxuong === pxDangChon);
      }
      danhSachMa = [...new Set(dataTheoPX.map(i => (i.mavattu || "").trim()).filter(Boolean))];
      danhSachMa.forEach(ma => {
        const option = document.createElement("option");
        option.value = ma;
        list.appendChild(option);
      });
    }

    // ====================
    // HIỂN THỊ
    // ====================
    function render() {
      const table = document.getElementById("table");
      table.innerHTML = "";

      const pxDangChon = pxInput.value.trim().toLowerCase();
      const tuKhoa = searchInput.value.trim().toLowerCase();

      let filteredData = [...data];

      if (pxDangChon) {
        filteredData = filteredData.filter(item => (item.phanxuong || "").toLowerCase() === pxDangChon);
      }

      if (tuKhoa) {
        filteredData = filteredData.filter(item =>
          (item.mavattu || "").toLowerCase().includes(tuKhoa) ||
          (item.barcode || "").toLowerCase().includes(tuKhoa)
        );
      }

      let tong = 0;
      filteredData.forEach((item) => {
        tong += Number(item.metdu || 0);
        table.innerHTML += `
          <tr class="${item.done ? 'done' : ''}">
            <td>${item.barcode || ""}</td>
            <td>${item.mavattu || ""}</td>
            <td>${item.phanxuong || ""}</td>
            <td>
              <input type="number" class="input-edit-met" value="${item.metdu || 0}" 
                onkeydown="updateMetDuDirectly(event, '${item.id}')">
            </td>
            <td>${item.ngay || ""}</td>
            <td>
              <button onclick="toggle('${item.id}')">${item.done ? "✅" : "📦"}</button>
            </td>
            <td>
              <button onclick="del('${item.id}')">❌</button>
            </td>
          </tr>
        `;
      });

      document.getElementById("tongmet").innerText = "Tổng: " + tong + " mét (Hiển thị 50 dòng mới nhất)";
    }

    window.updateMetDuDirectly = async function (e, id) {
      if (e.key === "Enter") {
        e.preventDefault();
        const newMetVal = Number(e.target.value);
        if (isNaN(newMetVal) || newMetVal < 0) {
          alert("Số mét không hợp lệ!");
          return;
        }
        try {
          await updateDoc(doc(db, "metdu", id), { metdu: newMetVal });
          e.target.blur();
        } catch (error) {
          console.error(error);
        }
      }
    };

    window.toggle = async function (id) {
      const item = data.find(d => d.id === id);
      if (!item) return;
      try {
        await updateDoc(doc(db, "metdu", id), { done: !item.done });
      } catch (error) {
        console.error(error);
      }
    };

    window.del = async function (id) {
      if (!confirm("Xóa mục này?")) return;
      try { await deleteDoc(doc(db, "metdu", id)); } catch (error) { console.error(error); }
    };

    window.clearAllData = async function () {
      if (!confirm("⚠️ Chắc chắn muốn XÓA TẤT CẢ vật tư số dư?")) return;
      try {
        const querySnapshot = await getDocs(collection(db, "metdu"));
        if(querySnapshot.empty) return;
        const batch = writeBatch(db);
        querySnapshot.forEach((docSnap) => { batch.delete(docSnap.ref); });
        await batch.commit();
        alert("Đã xóa toàn bộ!");
      } catch (error) { console.error(error); }
    };

    // EXPORT EXCEL
    window.exportExcel = async function () {
      try {
        const querySnapshot = await getDocs(collection(db, "metdu"));
        const allData = querySnapshot.docs.map(d => d.data());
        allData.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));

        const excelData = allData.map(i => ({
          Barcode: i.barcode || "",
          MaVatTu: i.mavattu || "",
          PhanXuong: i.phanxuong || "",
          MetDu: i.metdu || 0,
          Ngay: i.ngay || "",
          Done: i.done ? "X" : ""
        }));

        const ws = XLSX.utils.json_to_sheet(excelData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "MetDu");
        XLSX.writeFile(wb, "metdu_tatca.xlsx");
      } catch (error) {
        console.error("Lỗi xuất Excel: ", error);
      }
    };

    // IMPORT EXCEL
    document.getElementById("importFile").addEventListener("change", async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const dataExcel = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(dataExcel, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);

          for (const row of json) {
            const barcodeVal = row.Barcode ? String(row.Barcode).trim() : "";
            await addDoc(collection(db, "metdu"), {
              barcode: barcodeVal,
              mavattu: row.MaVatTu ? String(row.MaVatTu).trim() : "",
              phanxuong: row.PhanXuong ? String(row.PhanXuong).trim() : "",
              metdu: Number(row.MetDu) || 0,
              ngay: row.Ngay || new Date().toLocaleDateString("vi-VN"),
              done: row.Done === "X" || row.Done === "x",
              time: new Date().toISOString()
            });
          }
          alert("Import Excel thành công!");
        } catch (err) { alert("Lỗi đọc file."); }
        e.target.value = ""; 
      };
      reader.readAsArrayBuffer(file);
    });

    metduInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        addData();
      }
    });

    // ==========================================
    // CAMERA QUÉT BARCODE (ĐÃ TỐI ƯU AUTO FOCUS)
    // ==========================================
    let html5QrCode = new Html5Qrcode("reader");
    let cameraRunning = false;
    let currentCameraId = null;

    async function startCamera() {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
          const backCamera = devices.find(device => device.label.toLowerCase().includes("back")) || devices[devices.length - 1];
          currentCameraId = backCamera.id;

          await html5QrCode.start(
            currentCameraId,
            {
              fps: 15,
              qrbox: { width: 300, height: 150 },
              aspectRatio: 1.777,
              disableFlip: true,
              videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
            },
            (decodedText) => {
              if (!isCameraScanningAllowed) return;

              isCameraScanningAllowed = false;
              document.getElementById("reader").classList.add("cam-locked");

              barcodeInput.value = decodedText; 
              playBeepSound();                  
              navigator.vibrate?.(100);         
              
              // Sử dụng setTimeout (150ms) đảm bảo kích hoạt bàn phím ảo ổn định trên cả iOS & Android
              setTimeout(() => {
                metduInput.focus();
                metduInput.select(); // Bôi đen sẵn ô Số mét để tiện gõ đè nhập liệu luôn
              }, 150);
            }
          );
          cameraRunning = true;
          document.getElementById("toggleCamBtn").innerText = "📷 Tắt camera";
        }
      } catch (err) { console.error(err); }
    }

    async function stopCamera() {
      if (!cameraRunning) return;
      await html5QrCode.stop();
      cameraRunning = false;
      document.getElementById("toggleCamBtn").innerText = "📷 Mở camera";
    }

    window.toggleCamera = async function () {
      if (cameraRunning) { await stopCamera(); } else { await startCamera(); }
    };

    startCamera();

    pxInput.addEventListener("change", () => { updateDatalist(); render(); });
    searchInput.addEventListener("input", () => { render(); });

    const q = query(collection(db, "metdu"), orderBy("time", "desc"), limit(50));
    onSnapshot(q, (snap) => {
      data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateDatalist();
      render();
    });
  </script>

</body>
</html>
